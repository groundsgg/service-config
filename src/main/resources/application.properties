# gRPC Server
quarkus.grpc.server.use-separate-server=false
quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

# Grounds Push packages a single executable JAR.
quarkus.package.jar.type=uber-jar

# Proto Generation
quarkus.generate-code.grpc.scan-for-proto=gg.grounds:library-grpc-contracts-config

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=config}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
quarkus.flyway.schemas=config
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=true

# NATS
nats.url=${NATS_URL:nats://localhost:4222}
nats.max-reconnects=${NATS_MAX_RECONNECTS:-1}
nats.reconnect-wait-seconds=${NATS_RECONNECT_WAIT_SECONDS:2}
# Projected SA-Token (audience grounds-services) presented as the NATS bearer
# to the auth-callout broker. Absent locally → publisher connects without it.
grounds.token-file=${GROUNDS_TOKEN_FILE:/var/run/secrets/grounds/token}

# JWT validation for incoming gRPC calls (v2.2 Service Architecture).
# Verifies every Bearer token against the configured JWKS endpoint
# (k8s API-server by default) and enforces audience = grounds-services.
# Disable for local quarkusDev where no projected SA-Token is mounted.
grounds.auth.enabled=${GROUNDS_AUTH_ENABLED:true}
grounds.auth.jwks-url=${GROUNDS_AUTH_JWKS_URL:https://kubernetes.default.svc/openid/v1/jwks}
grounds.auth.expected-audience=${GROUNDS_AUTH_AUDIENCE:grounds-services}
grounds.auth.k8s-ca-file=${GROUNDS_AUTH_K8S_CA_FILE:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
grounds.auth.k8s-token-file=${GROUNDS_AUTH_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}

# Callers that may replace or delete documents of ONE app without being admins,
# as a comma-separated list of <subject-suffix>=<app>. This is how a service
# owns its own configuration: the Velocity proxies write the network MOTD, and
# making them config-admin to do it would hand them every other app's config.
#   GROUNDS_CONFIG_WRITERS=":velocity=velocity,:velocity-2=velocity"
# Empty (the default) means admin-only, which is what it was before.
grounds.auth.scoped-writers=${GROUNDS_CONFIG_WRITERS:}

# OpenTelemetry — emits a span per incoming gRPC call to Alloy → Tempo.
# Disabled by default in local dev; Helm chart sets OTEL_SDK_DISABLED=false.
quarkus.application.name=service-config
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}
