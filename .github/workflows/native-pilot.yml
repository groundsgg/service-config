name: Config Native Pilot

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Dockerfile.native
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - src/**
      - benchmarks/native-pilot/**
      - .github/workflows/native-pilot.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-pilot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Uses the same 16 GiB private-repository runner class as the regular build.
    # Forks cannot resolve this repository's private Maven dependencies.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ format('runs-on={0}/cpu=4/ram=16/family=m8a+m7a+m8i/spot=capacity-optimized/image=ubuntu24-full-x64/extras=s3-cache/sticky=docker:30gb', github.run_id) }}
    timeout-minutes: 60
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/setup-buildx-action@v4
      - name: Freeze source identity
        run: |
          printf 'BUILD_SOURCE_SHA256=%s\n' "$(python3 benchmarks/native-pilot/provenance.py --source-hash)" >> "$GITHUB_ENV"
      - name: Unit tests and JVM artifact
        run: |
          ./gradlew --no-daemon -Pgithub.user="$GITHUB_ACTOR" -Pgithub.token="$PACKAGES_TOKEN" \
            -Pkotlin.compiler.execution.strategy=in-process test quarkusBuild
          python3 -m unittest discover -s benchmarks/native-pilot -p 'test_*.py'
          docker build -f benchmarks/native-pilot/Dockerfile.jvm \
            --build-arg BUILD_COMMIT="$GITHUB_SHA" --build-arg BUILD_SOURCE_SHA256="$BUILD_SOURCE_SHA256" \
            -t grounds/service-config:jvm-pilot build
      - name: JVM runtime contracts
        run: |
          ./gradlew --no-daemon -Pgithub.user="$GITHUB_ACTOR" -Pgithub.token="$PACKAGES_TOKEN" \
            -Pkotlin.compiler.execution.strategy=in-process runtimeTest \
            -Dgrounds.runtime.image=grounds/service-config:jvm-pilot
      - name: Compile once and package both runtime bases
        run: |
          for target in native-micro native-distroless; do
            docker buildx build --load --platform linux/amd64 -f Dockerfile.native \
              --target "$target" --build-arg GITHUB_USER="$GITHUB_ACTOR" \
              --build-arg BUILD_COMMIT="$GITHUB_SHA" --build-arg BUILD_SOURCE_SHA256="$BUILD_SOURCE_SHA256" \
              --secret id=github_token,env=PACKAGES_TOKEN \
              -t "grounds/service-config:$target-pilot" .
          done
          python3 benchmarks/native-pilot/verify-images.py \
            grounds/service-config:native-micro-pilot grounds/service-config:native-distroless-pilot
      - name: Micro runtime contracts
        run: |
          ./gradlew --no-daemon -Pgithub.user="$GITHUB_ACTOR" -Pgithub.token="$PACKAGES_TOKEN" \
            -Pkotlin.compiler.execution.strategy=in-process runtimeTest \
            -Dgrounds.runtime.image=grounds/service-config:native-micro-pilot
      - name: Distroless runtime contracts
        id: distroless
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -Pgithub.user="$GITHUB_ACTOR" -Pgithub.token="$PACKAGES_TOKEN" \
            -Pkotlin.compiler.execution.strategy=in-process runtimeTest \
            -Dgrounds.runtime.image=grounds/service-config:native-distroless-pilot
      - name: Publish verified candidate images
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTROLESS_OUTCOME: ${{ steps.distroless.outcome }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in native-micro native-distroless; do
            if [ "$target" = native-distroless ] && [ "$DISTROLESS_OUTCOME" != success ]; then continue; fi
            alias_args=()
            if [ "$target" = native-micro ]; then alias_args=(-t "ghcr.io/$GITHUB_REPOSITORY:native-sha-$GITHUB_SHA"); fi
            docker buildx build --push --platform linux/amd64 -f Dockerfile.native \
              --target "$target" --build-arg GITHUB_USER="$GITHUB_ACTOR" \
              --build-arg BUILD_COMMIT="$GITHUB_SHA" --build-arg BUILD_SOURCE_SHA256="$BUILD_SOURCE_SHA256" \
              --secret id=github_token,env=PACKAGES_TOKEN --sbom=true --provenance=mode=max \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "ghcr.io/$GITHUB_REPOSITORY:$target-sha-$GITHUB_SHA" "${alias_args[@]}" .
          done
      - name: Record result
        if: always()
        env:
          DISTROLESS_OUTCOME: ${{ steps.distroless.outcome }}
        run: |
          {
            printf 'Native pilot commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Distroless runtime contracts: **%s**\n\n' "$DISTROLESS_OUTCOME"
            printf 'No Stage deployment is performed by this workflow. RAM/latency gates remain separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"
